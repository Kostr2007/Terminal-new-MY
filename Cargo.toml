[package]
name = "terminal-new-my"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "A Material You command experience for fish and Kitty"
license = "MIT"
repository = "https://github.com/Kostr2007/Terminal-new-MY"

[[bin]]
name = "tnmy"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
crossterm = "0.29"
# Exact wrapped-line counts keep preview scrolling correct for long Unicode lines.
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
libc = "0.2"
signal-hook = "0.3"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
